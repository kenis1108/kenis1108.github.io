const STORE_KEY = "wagon_gallery_v1";
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); }
  catch { return {}; }
}
function saveStore(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }
const regionLabel = {cn:"中国",eu:"欧洲",uk:"英国",us:"美国",jp:"日本",au:"澳洲"};
const typeLabel = {wagon:"瓦罐/旅行车", shooting_brake:"猎装"};
const eraLabel = {pioneer:"早期", classic:"经典", modern:"近现代"};
let activeId = null;
const grid = document.getElementById("grid");
const stats = document.getElementById("stats");
function filtered() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const region = document.getElementById("region").value;
  const type = document.getElementById("type").value;
  const era = document.getElementById("era").value;
  const collected = document.getElementById("collected").value;
  const sort = document.getElementById("sort").value || "year-desc";
  const store = loadStore();
  const list = CARS.filter(c => {
    if (region && c.region !== region) return false;
    if (type && c.type !== type) return false;
    if (era && c.era !== era) return false;
    const isCol = !!(store[c.id] && store[c.id].collected);
    if (collected === "yes" && !isCol) return false;
    if (collected === "no" && isCol) return false;
    if (collected === "flagged" && !(store[c.id] && store[c.id].flagged)) return false;
    if (!q) return true;
    const blob = [c.name, c.name_zh, c.note, ...(c.tags||[])].join(" ").toLowerCase();
    return blob.includes(q);
  });
  const byName = (a,b) => a.name.localeCompare(b.name);
  const byYearAsc = (a,b) => (a.year||0)-(b.year||0) || byName(a,b);
  const byYearDesc = (a,b) => (b.year||0)-(a.year||0) || byName(a,b);
  const sorters = {
    "year-desc": byYearDesc,
    "year-asc": byYearAsc,
    "name-zh": (a,b) => a.name_zh.localeCompare(b.name_zh, "zh") || byYearDesc(a,b),
    "name-en": (a,b) => a.name.localeCompare(b.name) || byYearDesc(a,b),
    "region": (a,b) => a.region.localeCompare(b.region) || byYearDesc(a,b),
    "type": (a,b) => a.type.localeCompare(b.type) || byYearDesc(a,b),
  };
  return list.sort(sorters[sort] || byYearDesc);
}
function render() {
  const store = loadStore();
  const list = filtered();
  const colCount = CARS.filter(c => store[c.id]?.collected).length;
  const flagCount = CARS.filter(c => store[c.id]?.flagged).length;
  stats.textContent = `显示 ${list.length} / 共 ${CARS.length} · 已收藏 ${colCount} · 标错图 ${flagCount}`;
  grid.innerHTML = list.map(c => {
    const st = store[c.id] || {};
    const img = c.image ? `<img loading="lazy" referrerpolicy="no-referrer" src="${c.image}" alt="${c.name_zh}" onerror="this.style.display='none'; this.parentNode.querySelector('.ph').style.display='flex'" />` : "";
    return `<article class="card ${st.collected ? "collected":""} ${st.flagged ? "flagged":""}" data-id="${c.id}">
      <div class="thumb">${img}<div class="ph" style="display:${c.image ? "none":"flex"}">暂无图片外链<br/>${c.name_zh}</div></div>
      <div class="meta">
        <div class="name">${c.name_zh}</div>
        <div class="name-en">${c.name}</div>
        <div class="row">
          <span class="chip">${c.year}${c.year_end && c.year_end!==c.year ? "–"+c.year_end : ""}</span>
          <span class="chip">${regionLabel[c.region]||c.region}</span>
          <span class="chip type-${c.type}">${typeLabel[c.type]||c.type}</span>
          <span class="chip">${eraLabel[c.era]||c.era}</span>
        </div>
        <div class="note">${c.note||""}</div>
        <div class="actions">
          <button class="ghost toggle">${st.collected ? "取消收藏":"收藏"}</button>
          <button class="ghost warn flag">${st.flagged ? "取消标错":"图不对"}</button>
          <button class="primary detail">详情</button>
        </div>
        <div class="credit">${c.image_credit ? c.image_credit : ""}</div>
      </div>
    </article>`;
  }).join("");
}
grid.addEventListener("click", (e) => {
  const card = e.target.closest(".card");
  if (!card) return;
  const id = card.dataset.id;
  const car = CARS.find(x => x.id === id);
  if (e.target.classList.contains("toggle")) {
    const store = loadStore();
    store[id] = store[id] || {};
    store[id].collected = !store[id].collected;
    saveStore(store); render(); return;
  }
  if (e.target.classList.contains("flag")) {
    const store = loadStore();
    store[id] = store[id] || {};
    store[id].flagged = !store[id].flagged;
    if (store[id].flagged) store[id].flagNote = "image mismatch";
    saveStore(store); render(); return;
  }
  if (e.target.classList.contains("detail") || e.target.tagName === "IMG") {
    openDlg(car);
  }
});
function openDlg(car) {
  activeId = car.id;
  const store = loadStore();
  document.getElementById("dlgImg").src = car.image_full || car.image || "";
  document.getElementById("dlgImg").style.display = car.image ? "block" : "none";
  document.getElementById("dlgTitle").textContent = car.name_zh;
  document.getElementById("dlgEn").textContent = `${car.name} · ${car.year}${car.year_end && car.year_end!==car.year ? "–"+car.year_end : ""} · ${regionLabel[car.region]} · ${typeLabel[car.type]}`;
  document.getElementById("dlgNote").textContent = car.note || "";
  document.getElementById("dlgMemo").value = store[car.id]?.memo || "";
  document.getElementById("dlgCredit").textContent = car.image_credit ? `图片来源：${car.image_credit}` : "暂无图片";
  document.getElementById("dlg").showModal();
}
document.getElementById("dlgClose").onclick = () => document.getElementById("dlg").close();
document.getElementById("dlgSave").onclick = () => {
  const store = loadStore();
  store[activeId] = store[activeId] || {};
  store[activeId].memo = document.getElementById("dlgMemo").value;
  store[activeId].collected = true;
  saveStore(store); render(); document.getElementById("dlg").close();
};
["q","region","type","era","collected","sort"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
  document.getElementById(id).addEventListener("change", render);
});
document.getElementById("exportBtn").onclick = () => {
  const store = loadStore();
  const flagged = CARS.filter(c => store[c.id]?.flagged).map(c => ({
    id:c.id, name_zh:c.name_zh, name:c.name, image:c.image, credit:c.image_credit
  }));
  const payload = {store, flagged};
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "wagon-collection.json";
  a.click();
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async (e) => {
  const file = e.target.files?.[0]; if (!file) return;
  const text = await file.text();
  saveStore(JSON.parse(text)); render();
};
render();
</script>
